[project]
name = "marvin-integration-bluesky"
version = "0.4.1"
description = "Bluesky integration for Marvin — Marvin's shared social.post capability, posted straight to the AT Protocol."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marvin-integration-sdk>=0.9,<1",
    # Counts grapheme clusters (\X) for Bluesky's 300-character limit; richtext.py has a pure-Python fallback if it is missing.
    "regex>=2023.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

# This is the seam that makes the plugin discoverable: an installed Marvin scans this group at
# startup and registers whatever providers it finds. No core or frontend changes needed.
[project.entry-points."marvin.integrations"]
bluesky = "marvin_integration_bluesky:BlueskyProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvin_integration_bluesky"]

# Dev only: resolve the SDK from the sibling checkout. Released builds take it from the index.
[tool.uv.sources]
marvin-integration-sdk = { path = "../MarvinIntegrationSDK", editable = true }

[tool.ruff]
line-length = 150
target-version = "py311"
